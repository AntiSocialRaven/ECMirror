    d.signals.length
      ? `<div class="card mt"><div class="card-h"><div><h3>Worth watching</h3>
    <div class="sub">From your check-ins over the last week or two</div></div></div>
    <div class="card-b"><ul class="clean">${d.signals.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="row" style="margin-top:12px"><button class="btn sm" onclick="openIssue()">${I("shield")}Log persistent fatigue</button></div></div></div>`
      : ""
  }

  <div class="card mt"><div class="card-h"><div><h3>Readiness</h3>
    <div class="sub">${d.readiness == null ? "No check-in yet today" : "From this morning's check-in"}</div></div>
    <button class="btn sm" onclick="go('wellness')">${I("heart")}${d.readiness == null ? "Check in" : "Update"}</button></div>
    <div class="card-b"><div class="ring-wrap">${ring(d.readiness, 104)}
      <div class="small">${d.readiness_notes.map((n, i) => `<div style="${i ? "color:var(--muted);margin-top:4px" : "font-weight:600"}">${esc(n)}</div>`).join("")}
      <div class="muted" style="margin-top:8px">The verdict above works without this &mdash; a check-in just makes it sharper.</div></div></div></div></div>
  </div>`;
        $$("[data-drift]").forEach(
          (b) =>
            (b.onclick = async () => {
              const x = d.drift[+b.dataset.drift];
              const r = await call("apply_drift", x.key, x.value);
              if (!r.ok) return toast("Could not apply", r.error, "bad");
              toast(`${x.what} updated`, `Now ${x.suggested}. Zones, paces and the plan follow it.`);
              refreshAll();
            }),
        );
      };

      // ------------------------------------------------------------------ ranks
      // One 0-100 score per best effort (the engine's REF_TIMES / Coggan ladder, age-adjusted) rendered as a tier.
      // Rank insignia. Seven tiers, so seven silhouettes: the shape alone says which rank you are looking at, which
      // matters because four of the seven colours are metallic neutrals that read the same to a colour-blind eye and
      // the same again in a photo. Complexity climbs with the tier - a bare hex, then banded, then a crest, then a
      // cut stone - so the progression is legible as a progression, while Iron still looks finished rather than
      // unfinished. All drawn on one 48x48 grid with one stroke weight so a row of them sits level.
      const HEX = "M24 4 41.3 14v20L24 44 6.7 34V14z";
      // a plain roundel: no corners at all, so Iron can't be mistaken for Silver's hex even with the inner art stripped
      const ROUND = "M24 5a19 19 0 1 0 0 38a19 19 0 1 0 0-38z";
      const CREST = "M24 4 40 9v14.5C40 33.2 33.1 40 24 44 14.9 40 8 33.2 8 23.5V9z";
      // same crest body as Gold, but the shoulders flare into swept wingtips before rejoining it - a silhouette
      // that reads as a different rank at a glance, not just a different colour, even with the inner art stripped
      // off at small sizes
      const WINGED_CREST =
        "M24 3 36 7 46.5 1.5 41 11 40 14.5C40 33.2 33.1 40 24 44 14.9 40 8 33.2 8 23.5L8 14.5 7 11 1.5 1.5 12 7z";
      // Platinum's wings plus two more feathers a side, each shorter and flatter than the one above
      const WINGED_CREST_3 =
        "M24 3 36 7 46.5 1.5 41 10 40.4 11.6 46.8 14.2 40 17.6 45.8 22 38.8 25.6 38 29.4 C36 36.5 30.5 41 24 44 C18 41 12 36.5 10 29.4 L9.2 25.6 2.2 22 8 17.6 1.2 14.2 7.6 11.6 7 10 1.5 1.5 12 7z";
      const GEM = "M14.5 8h19l8 11-17.5 25L6.5 19z";
      // the girdle line now breaks in the middle, same as the pavilion facets below it already did, so the whole
      // vertical channel behind the numeral is clear metal rather than just the lower half of it
      const GEM_FACETS =
        '<path d="M6.5 19h10M31.5 19h10M14.5 8l3.8 11M33.5 8l-3.8 11" opacity=".55"/>' +
        '<path d="M20.3 31 24 44M27.7 31 24 44" opacity=".4"/>';
      const TIER_ART = {
        // shape, where the division numeral sits (y), its size if not the default, and the tick's offset below
        // it if not the default 4.3 - the gem's pavilion gives the numeral a much shorter clean channel (girdle
        // at y19 to the facets at y31) than the other tiers get, so it runs smaller and tighter there
        Iron: { d: ROUND, y: 29 },
        Bronze: { d: HEX, y: 26.3, art: '<path d="M12.5 33h23M16 37.5h16" stroke-width="2"/>' },
        Silver: { d: HEX, y: 29, art: '<path d="M24 11.5 35 18v12l-11 6.5L13 30V18z" opacity=".55"/>' },
        Gold: {
          d: CREST,
          y: 26.5,
          art: '<path d="M24 9.5 34.5 13v9.5c0 6-4.3 10.4-10.5 13-6.2-2.6-10.5-7-10.5-13V13z" opacity=".5"/>',
        },
        Platinum: {
          d: WINGED_CREST,
          y: 26.5,
          art: '<path d="M24 9.5 34.5 13v9.5c0 6-4.3 10.4-10.5 13-6.2-2.6-10.5-7-10.5-13V13z" opacity=".45"/>',
        },
        Emerald: {
          d: WINGED_CREST_3,
          y: 26.5,
          art: '<path d="M24 9.5 34.5 13v9.5c0 6-4.3 10.4-10.5 13-6.2-2.6-10.5-7-10.5-13V13z" opacity=".45"/><path d="M18 15.5h12" opacity=".7"/>',
        },
        Diamond: { d: GEM, y: 28, fs: 10, to: 1.6, art: GEM_FACETS },
        Elite: {
          d: GEM,
          y: 27,
          fs: 12,
          art:
            GEM_FACETS +
            '<path d="M24 1.5v3.5M11 4.5l1.9 3M37 4.5l-1.9 3M1.5 13.5l3.2 1.8M46.5 13.5l-3.2 1.8" opacity=".95"/>',
        },
      };
      // divisions climb III -> II -> I within a tier; I is closest to promotion. Rather than bolt on a separate
      // motif, the numeral keeps the underline it was already sitting on room for ("clean metal") and that
      // underline simply grows with the division - same stroke language as the tier's own art, no new shape
      const DIV_LEN = { I: 9, II: 6, III: 3.5 };
      function divTick(div, a, size) {
        const w = DIV_LEN[div];
        if (!w || size < 36) return "";
        const y = a.y + (a.to != null ? a.to : 4.3);
        return `<line x1="${24 - w / 2}" x2="${24 + w / 2}" y1="${y}" y2="${y}" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>`;
      }

      // Below about 36px the inner facets and laurels turn to mush, so small badges keep the silhouette and the
      // numeral and drop everything else. The rank still reads; it just reads quietly.
      function tierBadge(t, size = 62) {
        const a = TIER_ART[t.tier] || TIER_ART.Iron,
          small = size < 36;
        const mark = t.div || (t.tier === "Elite" ? "★" : "");
        const fs = a.fs != null ? a.fs : t.div ? 12.5 : 15;
        return `<svg class="tb" width="${size}" height="${size}" viewBox="0 0 48 48" style="--c:${t.colour}"
    role="img" aria-label="${esc(t.tier)}${t.div ? " " + t.div : ""}">
    <path d="${a.d}" style="fill:color-mix(in srgb,var(--c) 17%,transparent);stroke:var(--c)" stroke-width="2.4" stroke-linejoin="round"/>
    ${small ? "" : `<g style="fill:none;stroke:var(--c)" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">${a.art || ""}${divTick(t.div, a, size)}</g>`}
    ${
      mark
        ? `<text x="24" y="${small ? a.y - 1 : a.y}" text-anchor="middle"
      style="fill:var(--c);font-size:${small ? 15 : fs}px;font-weight:800;letter-spacing:.04em">${mark}</text>`
        : ""
    }</svg>`;
      }

      const tierChip = (t) =>
        `<span class="tierchip" style="--c:${t.colour}">${tierBadge(t, 18)}${esc(t.tier)}${t.div ? " " + t.div : ""}</span>`;
      // progress through the current tier, with what the next one costs
      const ladder = (
        t,
        extra = "",
      ) => `<div class="ladder"><i style="--c:${t.colour};width:${Math.max(2, t.pct)}%"></i></div>
  <div class="ladder-l"><span>${esc(t.tier)}${t.div ? " " + t.div : ""} · ${t.score}</span><span>${t.next ? `${extra || ""}${esc(t.next)} at ${t.next_at}` : "top of the ladder"}</span></div>`;

      let RANKS = null;
      PAGES.ranks = async (c) => {
        const d = (RANKS = await call("records"));
        const ev = (s) => d.events.filter((e) => e.sport === s);
        const groups = [...new Set(d.events.map((e) => e.sport))];
        const o = d.overall,
          rr = d.race_rank;
        c.innerHTML = `<div class="page">
  <div class="card"><div class="card-b">
    ${
      o
        ? `<div class="rank-hero ladder-open" onclick="rankLadder()" title="See the whole ladder">${tierBadge(o, MOBILE ? 58 : 72)}
      <div class="who"><div class="tier">${esc(o.tier)}${o.div ? `<em>${o.div}</em>` : ""}</div>
        <div class="cls">${esc(o.cls)} · overall rank across ${d.by_sport.length} discipline${d.by_sport.length === 1 ? "" : "s"}</div></div>
      ${MOBILE ? "" : `<div class="sportchips">${d.by_sport.map(sportChip).join("")}</div>`}</div>
      ${ladder(o)}
      ${MOBILE && d.by_sport.length ? `<div class="sportchips mt">${d.by_sport.map(sportChip).join("")}</div>` : ""}
      ${
        rr
          ? `<div class="racerank">${tierBadge(rr, 34)}<div><b>${esc(rr.tier)}${rr.div ? " " + rr.div : ""} on race day</b>
        <span>Your best multisport result &mdash; ${esc(rr.label)} &middot; ${esc(rr.cls)}</span></div></div>`
          : ""
      }`
        : `<div class="empty" style="padding:20px">${I("medal")}<b>No ranks yet</b>Log a workout or a race result and your bests get graded.</div>`
    }
    <div class="row wrap" style="margin-top:14px;gap:10px">
      <button class="btn sm" onclick="rankLadder()">${I("medal")}See the rank ladder</button>
      <button class="btn sm" onclick="openEstimator()">${I("clock")}Estimate a time</button>
      <span class="small muted grow">Graded against world-class standards for a ${d.sex === "F" ? "woman" : "man"} of ${d.age} (age factor ${d.age_factor}).</span></div>
  </div></div>

  ${
    d.thresholds.length
      ? `<div class="card mt"><div class="card-h"><div><h3>Engine</h3>
    <div class="sub">What you can hold for an hour &mdash; the number that moves every PR at once</div></div></div>
    <div class="card-b"><div class="prlist">${d.thresholds.map(thrRow).join("")}</div>
    ${
      d.thresholds.some((t) => t.sport === "Bike")
        ? `<div class="small muted" style="margin-top:10px">${I("info")}
      Your bike rank is the better of FTP and your best 20, 40, 100 or 160 km ride or race. Course, wind and drafting
      move those times, so a hilly or sheltered result is a guide, not a stopwatch.</div>`
        : ""
    }
    </div></div>`
      : ""
  }

  ${
    d.multi.length
      ? `<div class="card mt"><div class="card-h"><div><h3>Race ranks</h3>
    <div class="sub">Multisport finishes, graded against world-best times for the distance</div></div></div>
    <div class="card-b"><div class="prlist">${d.multi.map(prRow).join("")}</div>
      ${
        d.multi.some((m) => !m.have)
          ? `<div class="small muted" style="margin-top:10px">Greyed-out distances are
        waiting on a finish time &mdash; add one to a race on the Races page.</div>`
          : ""
      }
      <div class="small muted" style="margin-top:10px">${I("info")} Courses differ far more than a track does
        &mdash; wetsuits, current, elevation, draft-legal racing &mdash; so read these as a guide, not a stopwatch.</div>
    </div></div>`
      : ""
  }

  ${
    d.off_bike.length
      ? `<div class="card mt"><div class="card-h"><div><h3>Off the bike</h3>
    <div class="sub">Run splits from your multisport races &mdash; the part bricks are training for</div></div></div>
    <div class="card-b"><div class="prlist">${d.off_bike.map(prRow).join("")}</div>
      <div class="small muted" style="margin-top:10px">${I("info")} Graded against world-class triathlon run
        splits, not track records: a run off the bike isn't a standalone run and shouldn't be scored like one.</div>
    </div></div>`
      : ""
  }

  ${groups
    .map(
      (s) => `<div class="card mt"><div class="card-h"><div><h3>${s} bests</h3>
    <div class="sub">From logged sessions, race results and the fastest block inside a longer session</div></div>
    </div>
    <div class="card-b"><div class="prlist">${ev(s).map(prRow).join("")}</div>
      ${
        ev(s).some((e) => !e.have)
          ? `<div class="small muted" style="margin-top:10px">Greyed-out distances need a
        session or a race at that distance &mdash; a fast block inside a longer one counts too.</div>`
          : ""
      }
    </div></div>`,
    )
    .join("")}

  ${
    d.bricks
      ? `<div class="card mt"><div class="card-h"><div><h3>${badge("Brick")} Bricks</h3>
    <div class="sub">No rank: a bike-then-run session has no standard to measure against</div></div></div>
    <div class="card-b"><div class="milegrid">
      <div class="mile"><div class="l">Bricks logged</div><b>${d.bricks.count}</b><div class="s">last ${esc(d.bricks.last)}</div></div>
      <div class="mile"><div class="l">Last 8 weeks</div><b>${d.bricks.recent}</b><div class="s">${d.bricks.recent ? "keeping the habit" : "none recently"}</div></div>
      <div class="mile"><div class="l">Longest brick</div><b>${esc(d.bricks.longest)}</b><div class="s">bike + run back to back</div></div></div>
      <div class="small muted" style="margin-top:10px">${I("info")} Where brick fitness does show up is
        ${d.off_bike.length ? "your off-the-bike run ranks above" : "your run split once you log one off the bike"}
        and your race rank.</div>
    </div></div>`
      : ""
  }

  ${
    d.milestones.length
      ? `<div class="card mt"><div class="card-h"><div><h3>Milestones</h3>
    <div class="sub">Volume and consistency bests &mdash; yours alone, so nothing to rank them against</div></div></div>
    <div class="card-b"><div class="milegrid">${d.milestones
      .map(
        (m) => `<div class="mile"><div class="l">${esc(m.label)}</div>
      <b>${esc(m.value)}</b><div class="s">${esc(m.sub)}</div></div>`,
      )
      .join("")}</div></div></div>`
      : ""
  }
  </div>`;
        $$("#content .pr[data-key]").forEach((b) => (b.onclick = () => prDetail(b.dataset.key)));
      };
      const rankRows = () => [...RANKS.events, ...RANKS.multi, ...RANKS.off_bike];
      const sportChip = (s) =>
        `<div class="sportchip">${tierBadge(s, 30)}<div><b>${esc(s.sport)}</b><span>${esc(s.tier)}${s.div ? " " + s.div : ""} · ${s.score}</span></div></div>`;

      function prRow(e) {
        if (!e.have)
          return `<div class="pr none unclaimed" title="${esc(e.hint)}">
    <div class="hd">${sportIcon(e.sport)}<b>${esc(e.label)}</b></div><div class="rt faint">&mdash;</div></div>`;
        return `<button class="pr" data-key="${e.sport}:${e.key}">
    <div class="hd">${sportIcon(e.sport)}<b>${esc(e.label)}</b></div><div>${tierChip(e)}</div>
    <div class="t">${esc(e.time)}</div><div class="rt">${esc(e.pace || "")}</div>
    ${ladder(e, e.to_next ? `${e.to_next} to ` : "")}
    <div class="sub">${[
      e.gain ? `<span class="pr-gain">${esc(e.gain)} faster than before</span>` : "",
      e.date ? esc(shortDate(e.date)) : "",
      esc(e.source),
    ]
      .filter(Boolean)
      .join(" &middot; ")}</div></button>`;
      }
      const THR_NAME = { Bike: "FTP", Run: "Threshold pace", Swim: "Critical swim speed" };
      function thrRow(t) {
        // a score over 100 means "faster than the world record", which a measured race never is but a mistyped FTP or
        // a botched CSS test easily can be - so say so instead of handing out an Elite badge
        return `<div class="pr none"><div class="hd">${sportIcon(t.sport)}<b>${esc(THR_NAME[t.sport] || t.sport)}</b></div>
    <div>${tierChip(t)}</div><div class="t">${esc(t.value)}</div>
    <div class="rt">${t.coggan ? esc(t.coggan) : ""}</div>${ladder(t)}
    <div class="sub">${esc(t.detail)}${
      t.score > 100
        ? ` &middot; <b style="color:var(--warn)">that is past
      world-record level &mdash; worth re-checking the number on Zones &amp; tests</b>`
        : ""
    }</div></div>`;
      }

      function stepsTable(e) {
        const here = (x, i, all) => x.tier === e.tier && x.div === e.div;
        return `<div class="steps">${e.steps
          .map(
            (x) => `<div class="${here(x) ? "here" : ""}" style="--c:${x.colour}">
    ${tierBadge(x, 26)}<span>${esc(x.tier)}${x.div ? " " + x.div : ""}</span><b>${esc(x.time)}</b><em>${esc(x.pace || "")}</em></div>`,
          )
          .join("")}</div>
    <div class="small muted">The time that just reaches each rank, for your age and sex. Iron is anything slower than Bronze III.</div>`;
      }

      function prDetail(key) {
        const e = rankRows().find((x) => `${x.sport}:${x.key}` === key);
        modal(
          `<div class="modal-h"><h3>${badge(e.sport)}${esc(e.label)}</h3><button class="icon-btn" data-close>${I("x")}</button></div>
    <div class="modal-b">
      <div class="rank-hero">${tierBadge(e, 64)}<div class="who">
        <div class="tier">${esc(e.time)}</div><div class="cls">${e.pace ? esc(e.pace) + " · " : ""}${esc(e.tier)}${e.div ? " " + e.div : ""} · ${esc(e.cls)}</div></div></div>
      ${ladder(e, e.to_next ? `${e.to_next} to ` : "")}
      <div class="rank-facts">
        ${[
          ["Score", `${e.score} / 100`],
          [
            "Set",
            e.date
              ? new Date(e.date + "T00:00").toLocaleDateString("en-US", {
                  month: "long",
                  day: "numeric",
                  year: "numeric",
                })
              : "from your profile",
          ],
          ["Source", e.source],
          ["Qualifying efforts", `${e.count}`],
          ...(e.prev ? [["Previous best", `${e.prev} (${e.gain} slower)`]] : []),
          ...(e.next_time ? [[`${e.next} needs`, `${e.next_time}${e.to_next ? ` · ${e.to_next} to find` : ""}`]] : []),
        ]
          .map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`)
          .join("")}
      </div>
      <button class="btn sm mt" id="stepsBtn">${I("medal")}Show the time for every rank</button>
      <div id="stepsBox" hidden>${stepsTable(e)}</div>
      <div class="small muted mt">Beating this means a faster logged session, a race result, or a faster block
        inside a longer run &mdash; all three count.</div>
    </div>
    <div class="modal-f"><span class="grow"></span><button class="btn" data-close>Close</button>
      <button class="btn primary" onclick="closeModal();go('log')">Open training log</button></div>`,
          { width: 520 },
        );
        const btn = $("#stepsBtn"),
          box = $("#stepsBox");
        btn.onclick = () => {
          box.hidden = !box.hidden;
          btn.lastChild.textContent = box.hidden ? "Show the time for every rank" : "Hide the times";
        };
      }

      async function openEstimator() {
        const d = await call("race_form", null),
          f0 = d.form;
        const groups = [...new Set(d.presets.map((p) => p.group))];
        let legs = f0.legs.map((l) => ({ ...l })),
          temp = f0.temp,
          preset = f0.preset,
          seq = 0,
          timer = 0;
        const m = modal(
          `<div class="modal-h"><div><h3>Estimate a time</h3>
      <div class="small muted">Pick an event or type any distance. This uses your current fitness, FTP, threshold pace and swim speed.</div></div>
      <button class="icon-btn" data-close>${I("x")}</button></div>
    <div class="modal-b">
      <label class="field"><span>Event</span><select id="esPreset">${groups
        .map(
          (g) =>
            `<optgroup label="${esc(g)}">${d.presets
              .filter((p) => p.group === g)
              .map((p) => `<option ${p.name === preset ? "selected" : ""}>${esc(p.name)}</option>`)
              .join("")}</optgroup>`,
        )
        .join("")}</select></label>
      <div class="row" style="margin:16px 0 8px;justify-content:space-between"><b>Legs</b><button type="button" class="btn sm" id="esAdd">${I("plus")}Add leg</button></div>
      <div class="leg-row small muted"><span></span><span>Sport</span><span>Distance</span><span>Climbing (${d.elev_unit})</span><span></span></div>
      <div class="legs-edit" id="esLegs"></div>
      <label class="field" style="margin-top:14px"><span>Temperature</span><div class="adorn"><input id="esTemp" type="number" value="${esc(temp)}"><em>${d.temp_unit}</em></div></label>
      <div id="esOut" class="mt"></div>
    </div>
    <div class="modal-f"><span class="grow"></span><button class="btn" data-close>Close</button></div>`,
          { width: 560 },
        );

        const show = (r) => {
          const out = $("#esOut", m);
          if (!r || !r.ok) {
            out.innerHTML = `<div class="small muted">${esc(r ? r.error : "Enter a distance for every leg.")}</div>`;
            return;
          }
          if (!r.total) {
            out.innerHTML = `<div class="small muted">The model has no physics for ${esc(r.segs.map((x) => x.sport).join(" + "))}, and there is nothing in your log to scale an estimate from.
        Log a session of that sport and this fills in.</div>`;
            return;
          }
          const k = r.rank;
          out.innerHTML = `<div class="rank-hero">${k ? tierBadge(k, 58) : ""}<div class="who">
        <div class="tier">${esc(r.total)}</div>
        <div class="cls">likely ${esc(r.lo)} &ndash; ${esc(r.hi)}${k ? ` &middot; ${esc(k.tier)}${k.div ? " " + k.div : ""} pace` : ""}</div></div></div>
      ${
        r.segs.length > 1
          ? `<div class="rank-facts">${r.segs.map((x) => `<div><span>${esc(x.label)}${x.trans ? "" : " " + esc(x.sport)}</span><b>${esc(x.time)}${x.pace ? " &middot; " + esc(x.pace) : ""}</b></div>`).join("")}</div>`
          : r.segs[0].pace
            ? `<div class="small muted mt">${esc(r.segs[0].pace)}</div>`
            : ""
      }
      <div class="small muted mt">${r.source === "log" ? "Scaled from your best effort of that sport in the training log. " : `Based on a fitness (CTL) of ${r.ctl}. `}${k ? "The rank is what this time would earn if you ran it. " : ""}Courses, weather and a bad day all move it.</div>`;
        };
        const run = () => {
          clearTimeout(timer);
          timer = setTimeout(async () => {
            const me = ++seq;

      // ------------------------------------------------------------------ scheduled sessions: weather + briefing
      let WX = null;
      async function forecast() {
        // Open-Meteo hourly forecast for the saved town (free, no key); cached 30 min, null when unavailable
        const loc = BOOT && BOOT.loc;
        if (!loc) return null;
        const key = loc.lat + "," + loc.lon;
        if (WX && WX.key === key && Date.now() - WX.at < 30 * 60000) return WX.data;
        try {
          const q =
            "hourly=temperature_2m,apparent_temperature,dew_point_2m,relative_humidity_2m,precipitation_probability,precipitation," +
            "weather_code,wind_speed_10m,wind_gusts_10m,uv_index,is_day&timezone=auto&forecast_days=10&past_days=92";
          const r = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&${q}`,
            { signal: AbortSignal.timeout(8000) },
          );
          if (!r.ok) return null;
          WX = { key, at: Date.now(), data: { hourly: (await r.json()).hourly } };
          return WX.data;
        } catch {
          return null;
        }
      }
      let WX_SENT = 0;
      async function syncWeather() {
        // hand the forecast to the engine (races, planned sessions, nutrition, logged workouts)

        WX_SENT = WX.at;
        await call("set_weather", wx);
        return true;

          try {
            res =
              (
                await (
                  await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`,
                    { signal: AbortSignal.timeout(8000) },

        $("#q").oninput = (e) => {

      const sortVal = (w, k) =>

      function sortLog(k) {

      function drawLog() {
        const q = LOG.q.toLowerCase();

              (!q || (w.notes + " " + w.nice + " " + w.date + " " + w.sport).toLowerCase().includes(q)),

      // ------------------------------------------------------------------ workout modal
      const RPE = [

  <div class="modal-f">${id ? `<button class="btn danger" id="wDel">${I("trash")}Delete</button>` : ""}<span class="grow"></span><span class="small faint kbd-hint">Ctrl+Enter to save</span><button class="btn" data-close>Cancel</button><button class="btn primary" id="wSave">${I("check")}Save workout</button></div>`);
        const f = $("#wf"),
          data = () => {

        <div><span>Duration</span><b>${p.dur}</b></div><div><span>${p.pace ? "Pace / speed" : "Estimated from"}</span><b style="font-size:${p.pace ? 18 : 14}px">${esc(p.pace || p.src)}</b></div>`
              : `<div style="grid-column:1/-1" class="small muted">${I("info")} Enter a duration to see training stress and calorie estimates.</div>`;
          }, 120);

        f.addEventListener("input", sync);

            ev.preventDefault();

          $("#wDel").onclick = async () => {
            closeModal();
            deleted(await call("delete_workouts", [id]), `${f.sport.value.toLowerCase()} on ${w.nice}`);
          };
        setTimeout(() => (e.h || e.m ? f.dist : f.m).focus(), 30);
      }

      // ------------------------------------------------------------------ interval timer
      // A structured session (warm-up, N reps, rests, cool-down) run off the clock. No GPS and nothing to carry:
      // timed reps and rests end themselves with a beep, and a distance rep ends with one tap (or the space bar) as
      // you cross the line. The phone can sit on the infield; it keeps time on its own clock, not on movement.
      const IV_SPORTS = ["Run", "Bike", "Swim", "Row"],
        IV_UNITS = { m: 1, yd: 0.9144, km: 1000, mi: 1609.344 },
        IV_PRESETS = [
          ["8 × 400 m", { by: "dist", reps: 8, dist: 400, unit: "m", rest: "1:30" }],
          ["6 × 800 m", { by: "dist", reps: 6, dist: 800, unit: "m", rest: "2:00" }],
          ["5 × 1 km", { by: "dist", reps: 5, dist: 1, unit: "km", rest: "2:00" }],
          ["4 × 1 mi", { by: "dist", reps: 4, dist: 1, unit: "mi", rest: "3:00" }],
          ["10 × 1 min", { by: "time", reps: 10, work: "1:00", rest: "1:00" }],
          ["6 × 3 min", { by: "time", reps: 6, work: "3:00", rest: "2:00" }],
          ["12 × 30/30", { by: "time", reps: 12, work: "0:30", rest: "0:30" }],
        ],
        IV_DEFAULT = {
          sport: "Run",
          reps: 8,
          by: "dist",
          dist: 400,
          unit: "m",
          work: "1:00",
          rest: 90,
          warm: 10,
          cool: 10,
          target: "",
          voice: true,
          gps: true,
        };
      const IV = {
        state: "setup",
        cfg: { ...IV_DEFAULT, ...store.get("ivCfg", {}) },
        run: null,
        timer: null,
        wl: null,
        ctx: null,
      };
      const parseSecs = (s) => {
        const t = String(s ?? "").trim();
        if (!t) return 0;
        const p = t.split(":").map(Number);
        return p.length > 3 || p.some((v) => isNaN(v) || v < 0) ? NaN : p.reduce((a, v) => a * 60 + v, 0);
      };
      const fmtT = (s) => {
        const t = Math.round(s * 10) / 10,
          m = Math.floor(t / 60);
        return `${m}:${(t - m * 60).toFixed(1).padStart(4, "0")}`;
      };
      const ivLabel = (c) => `${c.dist} ${c.unit}`;
      function ivSteps(c) {
        const out = [];
        if (c.warm > 0) out.push({ k: "warm", name: "Warm-up", secs: c.warm * 60 });
        for (let i = 1; i <= c.reps; i++) {
          out.push(
            c.by === "dist"
              ? {
                  k: "work",
                  rep: i,
                  of: c.reps,
                  dist_m: c.dist * IV_UNITS[c.unit],
                  label: ivLabel(c),
                  target: parseSecs(c.target),
                }
              : { k: "work", rep: i, of: c.reps, secs: parseSecs(c.work), label: c.work },
          );
          if (c.rest > 0 && i < c.reps) out.push({ k: "rest", name: "Rest", secs: c.rest });

    ${i.red_flags ? `<div class="flags" style="margin-top:12px"><b>${I("info")} Get it checked</b><span>${esc(i.red_flags)}</span></div>` : ""}
    ${mfold("Guidance", "What to do while it is active", `<ul class="clean" style="margin-top:10px">${i.guidance.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>`)}
    ${i.rehab ? mfold("Rehab", "Exercises that help", `<p style="margin:10px 0 0">${esc(i.rehab)}</p>`) : ""}
    ${i.notes ? mfold("Notes", "Your own notes", `<p style="margin:10px 0 0;white-space:pre-wrap">${esc(i.notes)}</p>`) : ""}
    <div class="mh-acts"><button class="btn" data-edit="${i.id}">${I("edit")}Edit</button>
      <button class="btn primary" data-resolve="${i.id}">${I("check")}Mark resolved</button></div></div>`;
        c.innerHTML = `<div class="page">
  <div class="mday"><b>${d.active.length ? `${d.active.length} active issue${d.active.length === 1 ? "" : "s"}` : "Nothing active"}</b><span>Plan adapts automatically</span></div>
  <button class="btn primary mwide" style="margin-top:0" onclick="openIssue()">${I("plus")}Report an issue</button>

  ${
    d.signals.length
      ? `<div class="mnext" style="cursor:default;flex-wrap:wrap;border-left:3px solid var(--warn)">${I("shield")}<span class="g"><b>Signs of accumulated fatigue</b>
    <span>${d.signals.map(esc).join(" · ")}</span></span>
    <button class="btn sm mw-wide" onclick="openIssue({kind:'Fatigue', name:'Persistent fatigue', severity:2})">Log persistent fatigue</button></div>`
      : ""
  }

  ${d.active.length ? d.active.map(issue).join("") : `<div class="mcard" style="margin-top:14px"><div class="empty">${I("shield")}<b>No active issues</b>Report an injury, illness or ongoing fatigue and your plan will adapt around it.</div></div>`}

  ${
    d.past.length
      ? `<div class="msec"><h3>History<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:550">tap to edit</span></h3>
    <div class="mcard">${d.past
      .map(
        (i) => `<div class="mw-row" data-edit="${i.id}"><div class="g"><b>${esc(i.name)}</b> ${badge2(i.kind)}
      <span class="small muted">${esc(i.since)} – ${esc(i.until || "starts later")}${i.days > 0 ? ` · ${i.days} days` : ""} · severity ${i.severity} (${esc(i.sev_label)})</span></div>${I("right")}</div>`,
      )
      .join("")}</div></div>`
      : ""
  }
  <div class="small muted" style="margin:14px 2px 0">General guidance, not a diagnosis. See a doctor or physio when anything under "Get it checked" applies.</div>
  </div>`;
        $$("[data-edit]").forEach((b) => (b.onclick = () => openIssue(byId(b.dataset.edit))));
        $$("[data-resolve]").forEach(
          (b) =>
            (b.onclick = async () => {
              await call("resolve_issue", +b.dataset.resolve);
              toast("Marked resolved", "Training ramps back over the next two weeks.");
              refreshAll();
            }),
        );
        $$("[data-sev]").forEach((g) =>
          $$("button", g).forEach(
            (b) =>
              (b.onclick = async () => {
                const i = byId(g.dataset.sev),
                  r = await call("save_issue", { ...i, severity: +b.dataset.n });
                if (!r.ok) return toast("Could not update", r.error, "bad");
                toast("Severity updated", `${i.name}: ${d.severity[b.dataset.n]}. Plan adjusted.`);
                refreshAll();
              }),
          ),
        );
      };

      // ---- phone: zones. The zone table for your main discipline first, every other discipline and the field
      // tests folded away, each test a full-width form with a thumb-sized apply button.
      MPAGES.zones = async (c) => {
        const d = await call("zones");
        const has = (s) => d.sports.includes(s);
        const tests = [
          has("Bike") && [
            "ftp",
            "FTP",
            "20-minute test",
            col("Bike"),
            "Warm up 15 min, 5 min all-out, 10 min easy, then 20 min as hard as you can evenly hold. FTP = 95% of the 20-min average.",
            [["20-min average power", "W", "number"]],
          ],
          [
            "lthr",
            "LTHR",
            "30-minute test",
            col("Run"),
            "Solo 30-minute all-out effort in your main sport. Lap at 10 min. LTHR = average HR of the last 20 minutes.",
            [["Average HR, last 20 min", "bpm", "number"]],
          ],
          [
            "maxhr",
            "Max heart rate",
            "ramp to failure",
            col("Other"),
            "After a thorough warm-up: 3 min hard, then a 1-min all-out uphill finish. Record the peak. Only if you are healthy and used to hard efforts.",
            [["Highest HR seen", "bpm", "number"]],
          ],
          has("Swim") && [
            "css",
            "CSS",
            "400 / 200 swim",
            col("Swim"),
            "After a warm-up: 400 all-out, rest 5–10 min, then 200 all-out. CSS = (T400 − T200) ÷ 2 per 100.",
            [
              [`400 ${d.swim_unit} time`, "m:ss", "text"],
              [`200 ${d.swim_unit} time`, "m:ss", "text"],
            ],
          ],
          has("Run") && [
            "race",
            "Run threshold",
            "from a race",
            col("Run"),
            "Any recent all-out run race from 5K to half marathon. Projects your ~1-hour pace (Riegel) and anchors run predictions.",
            [
              ["Race distance", d.dist_unit, "number"],
              ["Finish time", "h:mm:ss", "text"],
            ],
          ],
        ].filter(Boolean);
        const zrows = (g) =>
          g.zones
            .map((z, i) => {
              const cl = ZC[Math.min(ZC.length - 1, g.zones.length <= 4 ? i + 1 : i)];
              return `<div class="zone"><div class="z" style="--c:${cl}">${/^Z\w+/.test(z.name) ? z.name.split(" ")[0] : i + 1}</div><div>${esc(z.name.replace(/^Z\w+\s/, ""))}</div><div class="r">${esc(z.range)}</div></div>`;
            })
            .join("");
        c.innerHTML = `<div class="page">
  <div class="mday"><b>Your zones</b><span>${d.groups.length} set${d.groups.length === 1 ? "" : "s"} · retest every 6–8 weeks</span></div>
  <div class="msec" style="margin-top:6px"><h3>Training zones</h3>
    ${d.groups
      .map(
        (
          g,
          i,
        ) => `<details class="mfold mzfold" data-zf="${i}" ${i === 0 ? "open" : ""}><summary><span class="grow">${esc(g.title)}<small>${esc(g.sub)}</small></span>${I("right", "i chev")}</summary>
      <div class="body mzbody">${zrows(g)}</div></details>`,
      )
      .join("")}
    <button class="mnext" onclick="go('profile')" style="margin-top:10px">${I("edit")}<span class="g"><b>Zones follow your settings</b><span>Pick the heart-rate model in Profile &amp; settings</span></span>${I("right")}</button></div>
  <div class="msec"><h3>Field tests</h3>
    ${tests
      .map(
        ([
          k,
          title,
          sub,
          cl,
          proto,
          fields,
        ]) => `<details class="mfold mzfold" style="--c:${cl}"><summary><span class="grow"><i class="dot" style="--c:${cl};margin-right:6px"></i>${esc(title)}<small>${esc(sub)}</small></span>${I("right", "i chev")}</summary>
      <div class="body mzbody"><p class="proto">${esc(proto)}</p>
        <div class="mzfields">${fields.map(([l, u, typ]) => `<label class="field"><span>${esc(l)}</span><div class="adorn"><input data-t="${k}" type="${typ}" step="any" inputmode="${typ === "text" ? "text" : "decimal"}" placeholder="${typ === "text" ? esc(u) : ""}"><em>${typ === "text" ? "" : esc(u)}</em></div></label>`).join("")}</div>
        <button class="btn primary mwide" data-apply="${k}">Apply to profile</button></div></details>`,
      )
      .join("")}</div>
  </div>`;
        $$(".mzfold[data-zf]").forEach((f) => {
          const id = "zf." + f.dataset.zf;
          f.open = store.get(id, f.dataset.zf === "0");
          f.addEventListener("toggle", () => store.set(id, f.open));
        });
        $$("[data-apply]").forEach(
          (b) =>
            (b.onclick = async () => {
              const k = b.dataset.apply,
                vals = $$(`[data-t=${k}]`).map((x) => x.value);
              if (vals.some((v) => !v.trim())) return toast("Fill in the test result first", "", "warn");
              const r = await call("apply_test", k, vals);
              if (!r.ok) return toast("Check the inputs", r.error, "bad");
              toast("Profile updated", r.msg);
              refreshAll();
            }),
        );
      };

      // ---- phone: live workout. A workout screen, not a form: huge clock, two big readouts, controls in thumb reach.
      MPAGES.live = async (c) => {
        wireLiveOnce();
        if (!window.LiveWorkout) {
          c.innerHTML = `<div class="page"><div class="empty">${I("bolt")}<b>Live tracking needs the app</b>Open Endurance Coach on your phone to record a run or ride with GPS splits and pace alerts. On race day, the Watch app does this without your phone at all.</div></div>`;
          return;
        }
        if (LIVE.state === "active") {
          c.innerHTML = `<div class="page mlive" style="--c:${col(LIVE.sport)}">
      <div class="mlv-top"><span class="mlv-sport"><i class="dot" style="--c:${col(LIVE.sport)}"></i>${esc(LIVE.sport)}</span><span class="pill" id="livePill">On pace</span></div>
      <div class="mlv-time" id="liveTime">0:00</div>
      <div class="mlv-metrics">
        <div><span>Distance</span><b id="liveDist">0.00</b><small>${LIVE.unit}</small></div>
        <div><span>Pace</span><b id="livePace">–:––</b><small>/${LIVE.unit}</small></div></div>
      <div class="mlv-ctl">
        <button class="mlv-pause" id="livePauseBtn">${I(LIVE.paused ? "play" : "pause")}${LIVE.paused ? "Resume" : "Pause"}</button>
        <button class="mlv-end" id="liveEndBtn">${I("check")}End &amp; save</button></div>
      <button class="mlv-discard" id="liveDiscardBtn">${I("trash")}Discard workout</button>
      <div class="msec"><h3>Splits</h3><div class="mcard"><div class="p" id="liveSplits"></div></div></div>
    </div>`;
          paintLiveTick();
          paintLiveFlag();
          $("#livePauseBtn").onclick = async () => {
            LIVE.paused ? await LiveWorkout.resume() : await LiveWorkout.pause();
            LIVE.paused = !LIVE.paused;
            $("#livePauseBtn").innerHTML = `${I(LIVE.paused ? "play" : "pause")}${LIVE.paused ? "Resume" : "Pause"}`;
          };
          $("#liveEndBtn").onclick = async () => {
            const r = await LiveWorkout.stop();
            const res = await call("save_live_workout", {
              sport: LIVE.sport,
              date: BOOT.today,
              start: localIso(r.start),
              dur_s: r.dur_s,
              dist_km: r.dist_km,
              splits: r.splits,
            });
            LIVE.state = "setup";
            if (!res.ok) return toast("Could not save", res.error, "bad");
            toast(
              "Workout saved",
              `${LIVE.sport} · ${fmtClock(r.dur_s)} · ${(r.dist_km * (LIVE.unit === "mi" ? 0.621371 : 1)).toFixed(2)} ${LIVE.unit}`,
            );
            refreshAll();
            go("log");
          };
          $("#liveDiscardBtn").onclick = async () => {
            if (
              !(await confirmBox(
                "Discard this workout?",
                "The time and distance recorded so far will be lost.",
                "Discard",
              ))
            )
              return;
            await LiveWorkout.discard();
            LIVE.state = "setup";
            render();
          };
          return;
        }
        const opts = GPS_SPORTS.filter((s) => BOOT.sports.includes(s));
        const sport = opts.includes(LIVE.sport) ? LIVE.sport : opts[0] || "Run";
        const defPace = BOOT.run_thr_pace * (BOOT.dist_unit === "mi" ? 1.609344 : 1);
        c.innerHTML = `<div class="page mlive">
    <div class="mday"><b>Start a workout</b><span>GPS distance, pace, auto splits</span></div>
    <div class="mlv-sports" id="liveSport">${(opts.length ? opts : GPS_SPORTS).map((s) => `<label style="--c:${col(s)}"><input type="radio" name="liveSport" value="${s}" ${s === sport ? "checked" : ""}><span><i class="dot" style="--c:${col(s)}"></i>${s}</span></label>`).join("")}</div>
    <div class="mcard" id="liveTargetWrap" style="margin-top:12px;${PACE_SPORTS.includes(sport) ? "" : "display:none"}"><div class="p">
      <label class="field"><span>Target pace <span class="faint" style="font-weight:400">optional · m:ss / ${BOOT.dist_unit}</span></span>
        <input id="liveTargetPace" inputmode="numeric" placeholder="${fmtPace(defPace)}" value="${fmtPace(defPace)}"></label>
      <div class="small muted" style="margin-top:8px">Leave it blank to track without alerts. You get a buzz if you drift off pace.</div></div></div>
    <div class="small muted" style="margin:12px 2px 0">${I("info")} Needs location access the first time.</div>
    <button class="mlv-start" id="liveStartBtn">${I("play")}Start</button>
  </div>`;
        $$("#liveSport input").forEach(
          (r) =>
            (r.onchange = () => {
              LIVE.sport = r.value;
              $("#liveTargetWrap").style.display = PACE_SPORTS.includes(r.value) ? "" : "none";
            }),
        );
        $("#liveStartBtn").onclick = async () => {
          const chosen = $("input[name=liveSport]:checked").value;
          const target = PACE_SPORTS.includes(chosen)
            ? parsePace($("#liveTargetPace") ? $("#liveTargetPace").value : "")
            : null;
          LIVE.sport = chosen;
          LIVE.unit = BOOT.dist_unit;
          LIVE.target = target;
          LIVE.paused = false;
          LIVE.elapsed = 0;
          LIVE.dist = 0;
          LIVE.pace = null;
          LIVE.splits = [];
          LIVE.flag = null;
          await LiveWorkout.start(chosen, LIVE.unit, target);
          LIVE.state = "active";
          render();
        };
      };

      // ---- Start workout: one page for both ways to train. Free is the GPS screen above; Intervals lays a structure
      // (reps, rests, warm-up, cool-down) over the clock, with GPS distance on top when this device has it.
      const liveMode = () => store.get("liveMode", window.LiveWorkout ? "free" : "intervals");
      function wrapLive(gps) {
        return async (c) => {
          if (IV.state !== "setup") return ivView(c);
          if (LIVE.state === "active") return gps(c);
          const mode = liveMode();
          await (mode === "intervals" ? ivView(c) : gps(c));
          const pg = c.querySelector(".page");
          if (!pg) return;
          pg.insertAdjacentHTML(
            "afterbegin",
            `<div class="seg" id="liveMode" style="max-width:420px;margin:0 auto 12px">${[
              ["free", "bolt", "Free workout"],
              ["intervals", "clock", "Intervals"],
            ]
              .map(
                ([v, ic, n]) =>
                  `<label><input type="radio" name="liveMode" value="${v}" ${v === mode ? "checked" : ""}><span>${I(ic)}${n}</span></label>`,
              )
              .join("")}</div>`,
          );
          $$("#liveMode input").forEach(
            (r) =>
              (r.onchange = () => {
                store.set("liveMode", r.value);
                render(true);
              }),
          );
        };
      }
      PAGES.live = wrapLive(PAGES.live);
      MPAGES.live = wrapLive(MPAGES.live);

      // ---- phone: profile & settings. Each settings group is a fold (first one open) so the page opens as a short
      // list of headings, not 40 fields; the save bar, dirty tracking and sync/data cards behave as on desktop.
      MPAGES.profile = async (c) => {
        const [d, info] = await Promise.all([call("profile"), call("data_info")]);
        const saved = info.saved_at
          ? new Date(info.saved_at).toLocaleString("en-US", {
              month: "short",
              day: "numeric",
              hour: "numeric",
              minute: "2-digit",
            })
          : "never";
        const nm = (d.sections.flatMap((s) => s.fields).find((f) => f.key === "name") || {}).value;
        c.innerHTML = `<div class="page"><form id="pf">
    <div class="mday"><b>${nm ? esc(nm) : "Settings"}</b><span>Saved ${esc(saved)}</span></div>
    <div class="msec" style="margin-top:6px"><h3>Settings</h3>
    ${d.sections
      .map(
        (
          s,
          i,
        ) => `<details class="mfold mpfold" data-pf="${i}"><summary><span class="grow">${esc(s.title)}<small>${s.fields.length} setting${s.fields.length === 1 ? "" : "s"}</small></span>${I("right", "i chev")}</summary>
      <div class="body"><div class="form-grid mpgrid">${s.fields.map((f) => fieldRow(f, d.all_sports)).join("")}</div></div></details>`,
      )
      .join("")}</div>
    <div class="msec"><h3>Data &amp; sync</h3>
      <div class="mcard"><div class="p"><div class="data-grid"><div><b>${info.counts.workouts}</b><span>workouts</span></div><div><b>${info.counts.races}</b><span>races</span></div><div><b>${info.counts.wellness}</b><span>check-ins</span></div></div>
        <div class="small muted" style="margin-top:8px">${I("shield")} Stored on this phone, saved automatically as you go.</div>
        <div class="mpbtns"><button type="button" class="btn" onclick="openSetup()">${I("refresh")}Run setup again</button><button type="button" class="btn" id="expAll">${I("down")}Export all data</button><button type="button" class="btn" id="impAll">${I("up")}Restore from export</button></div></div></div>
      <div class="card" id="syncCard" style="margin-top:10px"></div>
      <div class="card" id="appSrcCard" style="margin-top:10px"></div>
      <div class="card" id="healthCard" style="margin-top:10px"></div></div>
    <div class="savebar"><span class="pill warn" id="dirty" style="display:none">Unsaved changes</span><span class="grow"></span>
      <button type="button" class="btn" id="pfReset">Discard</button><button type="submit" class="btn primary">${I("check")}Save settings</button></div></form></div>`;
        $$(".mpfold").forEach((f) => {
          const id = "pf." + f.dataset.pf;
          f.open = store.get(id, f.dataset.pf === "0");
          f.addEventListener("toggle", () => store.set(id, f.open));
        });
        const f = $("#pf");
        f.oninput = (e) => {
          if (e.target.closest("#syncCard")) return; // sync switches apply immediately, not on Save
          $("#dirty").style.display = "";
          $(".savebar", f).classList.add("dirty");
          if (e.target.closest(".switch"))
            e.target.closest(".switch").querySelector("span").textContent = e.target.checked ? "On" : "Off";
        };
        $("#pfReset").onclick = () => render(true);
        drawPhoneSync();
        drawAppSource();
        drawHealth();
        $("#expAll").onclick = async () => {
          const r = await call("export_all");
          if (!r.cancelled) toast("Data exported", r.path);
        };
        $("#impAll").onclick = async () => {
          if (
            !(await confirmBox(
              "Restore from export",
              "This replaces all current workouts, races, check-ins and settings with the file you pick. A backup of the current data is taken first.",
              "Choose file…",
              false,
            ))
          )
            return;
          const r = await call("import_all");
          if (r.cancelled) return;
          if (!r.ok) return toast("Restore failed", r.error, "bad");
          toast(
            "Data restored",
            `${r.counts.workouts} workouts, ${r.counts.races} races, ${r.counts.wellness} check-ins`,
          );
          refreshAll();
        };
        f.onsubmit = async (e) => {
          e.preventDefault();
          $$(".field.err", f).forEach((x) => x.classList.remove("err"));
          const r = await call("save_profile", formValues(f));
          if (!r.ok) {
            const el = $(`[data-f=${r.field}]`, f);
            if (el) {
              const fold = el.closest("details");
              if (fold) fold.open = true;
              el.classList.add("err");
              el.scrollIntoView({ block: "center", behavior: "smooth" });
            }
            return toast("Could not save", r.error, "bad");
          }
          toast("Settings saved", "Plan, predictions, zones and nutrition updated.");
          refreshAll();
        };
      };

      // ------------------------------------------------------------------ boot
      async function init() {
        API = window.pywebview.api;
        BOOT = await call("boot");
        if (!MOBILE) setTimeout(() => checkUpdates().catch(() => {}), 4000);
        buildNav();
        shell();
        const last = store.get("page", "dashboard");
        await go(NAV.flatMap((x) => x[1]).some((x) => x[0] === last) ? last : "dashboard");
        if (!BOOT.setup_done) openSetup();
        const wxTick = async () => {
          if ((await syncWeather().catch(() => false)) && !$("#modalRoot").innerHTML) render(true);
        };
        wxTick();
        setInterval(wxTick, 30 * 60000);
      }
      if (window.pywebview && window.pywebview.api) init();
      else window.addEventListener("pywebviewready", init);
    </script>
  </body>
</html>
