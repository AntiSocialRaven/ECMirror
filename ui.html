<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Endurance Coach</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #fff;
        --panel2: #f9fafb;
        --hover: #f2f4f7;
        --border: #e4e7ec;
        --border2: #d0d5dd;
        --text: #101828;
        --text2: #344054;
        --muted: #667085;
        --faint: #98a2b3;
        --brand: #0a6cff;
        --brand-hover: #005ae0;
        --brand-soft: #e6f0ff;
        --on-brand: #fff;
        --side: #fcfcfd;
        --side-border: #e4e7ec;
        --side-text: #475467;
        --side-muted: #98a2b3;
        --side-active: #eef1f5;
        --side-active-text: #101828;
        --ok: #0f9d58;
        --warn: #e07800;
        --bad: #e5412d;
        --grid: #eef0f3;
        --overlay: rgba(16, 24, 40, 0.45);
        --shadow-lg: 0 12px 32px -8px rgba(16, 24, 40, 0.22), 0 4px 8px -4px rgba(16, 24, 40, 0.08);
        --r: 10px;
        color-scheme: light;
      }
      [data-theme="dark"] {
        --bg: #0e1013;
        --panel: #16181d;
        --panel2: #1b1e24;
        --hover: #20242b;
        --border: #262a31;
        --border2: #343a44;
        --text: #e6e8eb;
        --text2: #c4c9d1;
        --muted: #8a919c;
        --faint: #5f6672;
        --brand: #3d95ff;
        --brand-hover: #63aaff;
        --brand-soft: #132a4a;
        --on-brand: #fff;
        --side: #121418;
        --side-border: #23262d;
        --side-text: #aeb4be;
        --side-muted: #5f6672;
        --side-active: #1f2229;
        --side-active-text: #f1f3f5;
        --ok: #34d17d;
        --warn: #ffa53d;
        --bad: #ff6b57;
        --grid: #20242a;
        --overlay: rgba(0, 0, 0, 0.6);
        --shadow-lg: 0 16px 40px -8px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* iOS inflates text of its own accord when the layout width changes - rotate the phone and the page comes
   back looking zoomed in, with nothing to undo it. Pin it. */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        font:
          14px/1.5 "Segoe UI Variable Text",
          "Segoe UI",
          system-ui,
          sans-serif;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--brand);
      }
      svg.i {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 10px;
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* shell */
      .app {
        display: grid;
        grid-template-columns: 244px 1fr;
        height: 100vh;
      }
      .sidebar {
        background: var(--side);
        border-right: 1px solid var(--side-border);
        color: var(--side-text);
        display: flex;
        flex-direction: column;
        padding: 14px 10px;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 4px 10px 16px;
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: var(--brand);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .logo svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand b {
        display: block;
        color: var(--text);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .nav-label {
        font-size: 10.5px;
        color: var(--side-muted);
        padding: 16px 11px 5px;
        font-weight: 650;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 8px 11px;
        border-radius: 7px;
        color: var(--side-text);
        text-decoration: none;
        cursor: pointer;
        margin: 1px 0;
        font-weight: 530;
      }
      .nav a:hover {
        background: var(--side-active);
        color: var(--side-active-text);
      }
      .nav a.active {
        background: var(--brand-soft);
        color: var(--brand);
        font-weight: 600;
      }
      .nav a.active svg {
        color: var(--brand);
      }
      .side-foot {
        margin-top: auto;
        padding: 16px 4px 0;
      }
      .race-mini {
        border: 1px solid var(--side-border);
        background: var(--panel);
        border-radius: var(--r);
        padding: 11px 12px;
      }
      .race-mini:hover {
        border-color: var(--border2);
      }
      .race-mini .t {
        font-size: 11px;
        color: var(--side-muted);
        font-weight: 600;
      }
      .race-mini .n {
        color: var(--text);
        font-weight: 600;
        margin: 3px 0 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .race-mini .d {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 6px;
        color: var(--muted);
      }
      .bar {
        height: 6px;
        border-radius: 6px;
        background: var(--grid);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        border-radius: 6px;
        background: var(--brand);
      }

      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100vh;
      }
      .topbar {
        height: 60px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .crumb {
        font-size: 12px;
        color: var(--muted);
      }
      .topbar h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chip-date {
        font-size: 12.5px;
        color: var(--muted);
        padding: 0 6px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--hover);
        border: 1px solid var(--border);
        color: var(--text2);
        display: grid;
        place-items: center;
        font-weight: 650;
        font-size: 12px;
        cursor: pointer;
      }
      .avatar:hover {
        border-color: var(--border2);
      }
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 28px 32px 56px;
      }
      /* capped rather than fluid: past about 1360px the charts stretch into bands and the eye loses the row */
      .page {
        max-width: 1360px;
        margin: 0 auto;
      }

      /* primitives */
      .grid {
        display: grid;
        gap: 18px;
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .g4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .g5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .g-main {
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      }
      .mt {
        margin-top: 18px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--r);
        min-width: 0;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      }
      [data-theme="dark"] .card {
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .card-h {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px 16px;
        padding: 18px 20px 0;
        flex-wrap: wrap;
      }
      .card-h h3 {
        margin: 0;
        font-size: 15.5px;
        font-weight: 640;
        letter-spacing: -0.012em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-h .sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 3px;
        max-width: 62ch;
        line-height: 1.5;
      }
      .card-b {
        padding: 16px 20px 20px;
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      .small {
        font-size: 12.5px;
      }
      .grow {
        flex: 1;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 12px;
        border-radius: 6px;
        border: 1px solid var(--border2);
        background: var(--panel);
        cursor: pointer;
        font-weight: 550;
        white-space: nowrap;
        color: var(--text2);
      }
      .btn:hover {
        background: var(--hover);
        color: var(--text);
      }
      .btn:focus-visible,
      .icon-btn:focus-visible,
      .nav a:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 1px;
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--on-brand);
      }
      .btn.primary:hover {
        background: var(--brand-hover);
        border-color: var(--brand-hover);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.danger:hover {
        border-color: var(--bad);
      }
      .btn.danger-solid {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
      }
      .btn.sm {
        height: 28px;
        padding: 0 10px;
        font-size: 12.5px;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        color: var(--muted);
      }
      .icon-btn:hover {
        background: var(--hover);
        color: var(--text);
      }
      .icon-btn:disabled {
        opacity: 0.35;
        cursor: default;
        background: transparent;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        color: color-mix(in srgb, var(--c) 75%, var(--text));
        background: color-mix(in srgb, var(--c) 13%, transparent);
        padding: 2px 8px;
        border-radius: 5px;
      }
      .badge i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--c);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 550;
        padding: 1px 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
        color: var(--text2);
        background: var(--panel);
      }
      .pill.ok,
      .pill.warn,
      .pill.bad,
      .pill.info {
        border-color: transparent;
      }
      .pill.ok {
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 13%, transparent);
      }
      .pill.warn {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 14%, transparent);
      }
      .pill.bad {
        color: var(--bad);
        background: color-mix(in srgb, var(--bad) 12%, transparent);
      }
      .pill.info {
        color: var(--brand);
        background: var(--brand-soft);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--c);
      }

      /* kpis */
      .kpi {
        position: relative;
        overflow: hidden;
        padding: 16px 18px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "l l" "v sp" "s s";
        align-items: end;
        column-gap: 10px;
      }
      .kpi .l {
        grid-area: l;
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kpi .v {
        grid-area: v;
        font-size: 30px;
        font-weight: 680;
        letter-spacing: -0.03em;
        margin: 8px 0 3px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        line-height: 1.05;
      }
      .kpi .v small {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
        margin-left: 4px;
      }
      .kpi .s {
        grid-area: s;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        min-height: 18px;
      }
      .kpi .spark {
        grid-area: sp;
        width: 88px;
        height: 30px;
        margin-bottom: 8px;
      }
      .kpi.flat {
        background: var(--panel2);
      }
      .kpi {
        transition: border-color 0.15s;
      }
      .g5 > .kpi:hover,
      .g4 > .kpi:hover {
        border-color: var(--border2);
      }
      .trend-up {
        color: var(--ok);
        font-weight: 600;
      }
      .trend-down {
        color: var(--warn);
        font-weight: 600;
      }
      .trend-bad {
        color: var(--bad);
        font-weight: 600;
      }

      /* tables */
      .tbl-wrap {
        overflow: auto;
      }
      table.tbl {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      .tbl th {
        position: sticky;
        top: 0;
        background: var(--panel2);
        text-align: left;
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        user-select: none;
        z-index: 1;
      }
      .tbl th.sort {
        cursor: pointer;
      }
      .tbl th.sort:hover {
        color: var(--text);
      }
      .tbl td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .tbl tr:last-child td {
        border-bottom: 0;
      }
      .tbl tbody tr {
        cursor: pointer;
      }
      .tbl tbody tr:hover td {
        background: var(--hover);
      }
      .tbl tr.sel td {
        background: var(--brand-soft) !important;
      }
      .tbl td.notes {
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--muted);
      }
      .tbl .num {
        text-align: right;
      }
      input[type="checkbox"] {
        accent-color: var(--brand);
        width: 15px;
        height: 15px;
        cursor: pointer;
      }

      /* forms */
      .input,
      .field input:not([type="range"]):not([type="radio"]):not([type="checkbox"]),
      .field select,
      .field textarea,
      select.input {
        height: 34px;
        border: 1px solid var(--border2);
        border-radius: 6px;
        background: var(--panel);
        padding: 0 10px;
        outline: none;
        width: 100%;
      }
      .field textarea {
        height: auto;
        padding: 8px 10px;
        resize: vertical;
      }
      .input:focus,
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .field > span {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text2);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .field .help {
        font-size: 12px;
        color: var(--muted);
        font-weight: 400;
      }
      .field.err input,
      .field.err select {
        border-color: var(--bad);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 15%, transparent);
      }
      .adorn {
        position: relative;
      }
      .adorn input {
        padding-right: 52px !important;
      }
      .adorn em {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-style: normal;
        font-size: 12px;
        color: var(--faint);
        pointer-events: none;
      }
      .dur {
        display: grid;
        grid-template-columns: 1fr auto 1fr auto 1fr auto;
        align-items: center;
        gap: 6px;
      }
      .dur em {
        font-style: normal;
        font-size: 12px;
        color: var(--faint);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 16px;
      }
      .form-grid .full {
        grid-column: 1/-1;
      }
      input[type="range"] {
        accent-color: var(--brand);
        width: 100%;
        height: 24px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border2);
        border-radius: 6px;
        overflow: hidden;
        flex-wrap: wrap;
        background: var(--panel);
      }
      .seg label,
      .seg button {
        position: relative;
        cursor: pointer;
        border: 0;
        background: transparent;
        padding: 0;
        border-right: 1px solid var(--border);
      }
      .seg label:last-child,
      .seg button:last-child {
        border-right: 0;
      }
      .seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .seg span,
      .seg button {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        font-weight: 550;
        color: var(--muted);
        font-size: 13px;
      }
      .seg input:checked + span,
      .seg button.on {
        background: var(--side-active);
        color: var(--text);
      }
      .seg.rate {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }
      .seg.rate button {
        justify-content: center;
        font-variant-numeric: tabular-nums;
      }
      .seg input:focus-visible + span {
        outline: 2px solid var(--brand);
        outline-offset: -2px;
      }
      .search {
        position: relative;
      }
      .search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--faint);
      }
      .search input {
        padding-left: 32px !important;
      }

      /* charts */
      .chart-wrap {
        position: relative;
      }
      .chart .grid {
        stroke: var(--grid);
        stroke-width: 1;
      }
      .chart .zero {
        stroke: var(--border2);
        stroke-width: 1;
      }
      .chart text {
        fill: var(--faint);
        font-size: 11px;
        font-family: inherit;
      }
      .chart .line {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .chart .hx {
        stroke: var(--border2);
        stroke-dasharray: 3 3;
        visibility: hidden;
      }
      .chart .today {
        stroke: var(--faint);
        stroke-dasharray: 2 3;
      }
      .tip {
        position: absolute;
        pointer-events: none;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 12px;
        min-width: 140px;
        opacity: 0;
        z-index: 5;
      }
      .tip b {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
      }
      .tip div {
        display: flex;
        align-items: center;
        gap: 7px;
        justify-content: space-between;
      }
      .tip div span {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 10px;
        height: 3px;
        border-radius: 2px;
        background: var(--c);
      }
      .legend i.dash {
        height: 0;
        border-top: 2px dashed var(--c);
        border-radius: 0;
        width: 14px;
        background: none;
      }

      /* dashboard */
      .today-item {
        border: 1px solid var(--border);
        border-left: 3px solid var(--c);
        border-radius: 6px;
        padding: 11px 12px;
        margin-bottom: 10px;
      }
      .today-item p {
        margin: 8px 0 6px;
        color: var(--text2);
      }
      .fuel-list {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12.5px;
        color: var(--muted);
      }
      .fuel-list li {
        padding: 3px 0;
        display: flex;
        gap: 8px;
      }
      .fuel-list li b {
        color: var(--text2);
        font-weight: 600;
        min-width: 52px;
      }
      .ring-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .split-legend {
        display: grid;
        gap: 8px;
      }
      .split-legend div {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
      }
      .split-legend div b {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .macro-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .macro-row div {
        padding: 8px 10px;
        border-right: 1px solid var(--border);
      }
      .macro-row div:last-child {
        border-right: 0;
      }
      .macro-row b {
        display: block;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .macro-row span {
        font-size: 12px;
        color: var(--muted);
      }
      .empty {
        padding: 36px 18px;
        text-align: center;
        color: var(--muted);
      }
      .empty svg.i {
        width: 28px;
        height: 28px;
        color: var(--faint);
        margin-bottom: 8px;
      }
      .empty b {
        display: block;
        color: var(--text);
        font-size: 14px;
        margin-bottom: 4px;
      }
      .section-t {
        margin: 28px 0 12px;
        font-size: 15px;
        font-weight: 620;
      }

      /* plan */
      .phase-strip {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 150px;
        padding: 6px 2px 0;
      }
      .wk {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        min-width: 0;
        height: 100%;
        justify-content: flex-end;
      }
      .wk .col {
        width: 100%;
        max-width: 36px;
        border-radius: 3px;
        background: color-mix(in srgb, var(--c) 32%, var(--panel));
        position: relative;
        overflow: hidden;
      }
      .wk .col i {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--c);
      }
      .wk:hover .col {
        filter: brightness(0.95);
      }
      .wk.sel .col {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .wk small {
        font-size: 10.5px;
        color: var(--faint);
        white-space: nowrap;
      }
      .wk.cur small {
        color: var(--brand);
        font-weight: 700;
      }
      .wk .flag {
        height: 12px;
        color: var(--bad);
        display: grid;
        place-items: center;
      }
      .wk .flag svg {
        width: 11px;
        height: 11px;
        fill: currentColor;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }
      .day {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px;
        min-height: 190px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .day.today {
        border-color: var(--brand);
        box-shadow: inset 0 0 0 1px var(--brand);
      }
      .day.past {
        opacity: 0.7;
      }
      .day-h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .day-h b {
        font-size: 17px;
        font-weight: 650;
      }
      .day-h span {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .sess {
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--c);
        border-radius: 5px;
        padding: 7px 8px;
        cursor: pointer;
      }
      .sess:hover {
        border-color: var(--border2);
        border-left-color: var(--c);
      }
      .sess .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--text);
      }
      .sess .meta {
        font-size: 12px;
        color: var(--muted);
        margin: 1px 0 4px;
        display: flex;
        gap: 6px;
      }
      .sess p {
        margin: 0;
        font-size: 12px;
        color: var(--text2);
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .check {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--ok);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .check svg.i {
        width: 10px;
        height: 10px;
        stroke-width: 3;
      }

      /* race */
      .hero {
        box-shadow: inset 4px 0 0 var(--brand);
        background: color-mix(in srgb, var(--brand) 6%, var(--panel));
        padding: 20px 22px 20px 26px;
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 24px;
        align-items: start;
      }
      .hero .eyebrow {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hero h2 {
        margin: 6px 0 2px;
        font-size: 22px;
        letter-spacing: -0.01em;
        font-weight: 650;
      }
      .hero .big {
        font-size: 38px;
        font-weight: 650;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
        margin-top: 4px;
      }
      .hero .stat {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--panel2);
      }
      .hero .stat b {
        display: block;
        font-size: 18px;
        font-weight: 650;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .splitbar {
        display: flex;
        height: 30px;
        border-radius: 5px;
        overflow: hidden;
        gap: 2px;
      }
      .splitbar div {
        background: var(--c);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        min-width: 6px;
        white-space: nowrap;
        overflow: hidden;
      }
      .legs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin-top: 14px;
      }
      .leg {
        border-left: 3px solid var(--c);
        padding: 1px 0 1px 11px;
      }
      .leg .t {
        font-size: 19px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .leg .n {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .pace-card .kicker {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .pace-card .target {
        font-size: 21px;
        font-weight: 650;
        margin: 2px 0 8px;
        font-variant-numeric: tabular-nums;
      }
      ul.clean {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      ul.clean li {
        padding: 6px 0 6px 14px;
        position: relative;
        color: var(--text2);
        border-top: 1px solid var(--border);
      }
      ul.clean li:first-child {
        border-top: 0;
      }
      ul.clean li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 14px;
        width: 5px;
        height: 5px;
        border-radius: 1px;
        background: var(--faint);
      }
      .timeline {
        position: relative;
      }
      .tl {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 16px;
        padding: 0 0 14px;
        position: relative;
      }
      .tl::before {
        content: "";
        position: absolute;
        left: 111px;
        top: 9px;
        bottom: -5px;
        width: 1px;
        background: var(--border2);
      }
      .tl:last-child::before {
        display: none;
      }
      .tl .when {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-align: right;
        padding-top: 1px;
        font-variant-numeric: tabular-nums;
      }
      .tl .body {
        padding-left: 18px;
        position: relative;
      }
      .tl .body::before {
        content: "";
        position: absolute;
        left: -9px;
        top: 5px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--brand);
      }
      .tl .body b {
        display: block;
        font-weight: 600;
      }
      .tl .body span {
        color: var(--muted);
        font-size: 12.5px;
      }
      .hbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 64px;
        gap: 4px 12px;
        align-items: center;
      }
      .hbar .lab {
        font-size: 12.5px;
        color: var(--text2);
        margin-top: 6px;
      }
      .hbar .val {
        font-size: 12.5px;
        font-weight: 600;
        text-align: right;
        font-variant-numeric: tabular-nums;
        margin-top: 6px;
      }
      .hbar .bar {
        grid-column: 1/-1;
        height: 6px;
      }
      .checks label {
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 5px 0;
        cursor: pointer;
      }
      .checks label.done span {
        text-decoration: line-through;
        color: var(--faint);
      }
      .check-group {
        font-size: 12px;
        color: var(--muted);
        font-weight: 650;
        margin: 10px 0 2px;
      }

      /* zones */
      .zone {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 7px 0;
        border-top: 1px solid var(--border);
      }
      .zone:first-child {
        border-top: 0;
      }
      .zone .z {
        height: 20px;
        border-radius: 4px;
        background: var(--c);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      .zone .r {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .proto {
        font-size: 12.5px;
        color: var(--muted);
        margin: 6px 0 12px;
      }
      .test-card b.t {
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .note-card {
        background: var(--panel2);
      }

      /* modal / toast */
      .overlay {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        display: grid;
        place-items: center;
        z-index: 50;
      }
      .modal {
        background: var(--panel);
        border-radius: 10px;
        box-shadow: var(--shadow-lg);
        width: min(680px, 94vw);
        max-height: 92vh;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
      }
      .modal-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
      }
      .modal-h h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }
      .modal-b {
        padding: 18px;
        overflow-y: auto;
      }
      .modal-f {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px 18px;
        border-top: 1px solid var(--border);
        background: var(--panel2);
        border-radius: 0 0 10px 10px;
      }
      .estimate {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .estimate div {
        padding: 9px 12px;
        border-right: 1px solid var(--border);
      }
      .estimate div:last-child {
        border-right: 0;
      }
      .estimate span {
        font-size: 12px;
        color: var(--muted);
        display: block;
      }
      .estimate b {
        font-size: 17px;
        font-variant-numeric: tabular-nums;
      }
      #toasts {
        position: fixed;
        top: 72px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 60;
        width: 360px;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: start;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        border-radius: 8px;
        padding: 11px 10px 11px 12px;
        animation: tin 0.15s ease-out;
      }
      .toast .ic {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--c);
        color: #fff;
        display: grid;
        place-items: center;
        margin-top: 1px;
      }
      .toast .ic svg {
        width: 11px;
        height: 11px;
        stroke-width: 3;
      }
      .toast b {
        display: block;
        font-size: 13px;
        font-weight: 600;
      }
      .toast span {
        font-size: 12.5px;
        color: var(--muted);
        white-space: pre-line;
        display: block;
        margin-top: 2px;
        max-height: 180px;
        overflow: auto;
      }
      .toast .icon-btn {
        width: 24px;
        height: 24px;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .savebar {
        position: sticky;
        bottom: 0;
        margin-top: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--r);
        box-shadow: var(--shadow-lg);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .principles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .principles div {
        padding: 12px 14px;
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .principles div:nth-child(3n) {
        border-right: 0;
      }
      .principles div:nth-last-child(-n + 3) {
        border-bottom: 0;
      }
      .principles b {
        display: block;
        margin-bottom: 3px;
        font-weight: 600;
      }
      .principles span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .loading {
        display: grid;
        place-items: center;
        height: 60vh;
        color: var(--muted);
      }
      .spin {
        width: 22px;
        height: 22px;
        border: 2px solid var(--border);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: rot 0.7s linear infinite;
      }
      @keyframes rot {
        to {
          transform: rotate(360deg);
        }
      }

      /* settings & races */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chips label {
        cursor: pointer;
        position: relative;
      }
      .chips input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .chips span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 5px;
        border: 1px solid var(--border2);
        font-size: 12.5px;
        font-weight: 550;
        color: var(--muted);
        background: var(--panel);
      }
      .chips input:checked + span {
        border-color: var(--brand);
        color: var(--text);
        background: var(--brand-soft);
      }
      .chips input:focus-visible + span {
        outline: 2px solid var(--brand);
      }
      .chips span i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--c);
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        height: 34px;
      }
      .switch input {
        position: absolute;
        opacity: 0;
      }
      .switch b {
        width: 34px;
        height: 20px;
        border-radius: 20px;
        background: var(--border2);
        position: relative;
        flex: none;
      }
      .switch b::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.12s;
      }
      .switch input:checked + b {
        background: var(--brand);
      }
      .switch input:checked + b::after {
        left: 16px;
      }
      .switch input:focus-visible + b {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
      .prio {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 18px;
        padding: 0 4px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
        color: var(--c);
        border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
        background: color-mix(in srgb, var(--c) 10%, transparent);
        line-height: 1;
      }
      .seg span.prio {
        display: inline-grid;
        padding: 0 4px;
      }
      .legs-edit {
        display: grid;
        gap: 8px;
      }
      .leg-row {
        display: grid;
        grid-template-columns: 24px 150px 1fr 1fr 32px;
        gap: 8px;
        align-items: center;
      }
      .leg-row.multi {
        grid-template-columns: 24px 136px 1fr 1fr 1.1fr 32px;
      }
      .leg-row .n {
        font-size: 12px;
        color: var(--faint);
        font-weight: 700;
        text-align: center;
      }
      .season {
        position: relative;
        height: 84px;
        margin: 8px 10px 0;
      }
      .season .axis {
        position: absolute;
        left: 0;
        right: 0;
        top: 40px;
        height: 2px;
        background: var(--border2);
      }
      .season .now {
        position: absolute;
        top: 32px;
        width: 2px;
        height: 18px;
        background: var(--brand);
      }
      .season .now span {
        position: absolute;
        top: -18px;
        left: -14px;
        font-size: 11px;
        color: var(--brand);
        font-weight: 700;
      }
      .season .pin {
        position: absolute;
        top: 35px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
      }
      .season .pin .dotp {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: var(--c);
        transform: rotate(45deg);
        outline: 3px solid var(--panel);
      }
      .season .pin small {
        margin-top: 6px;
        font-size: 12px;
        white-space: nowrap;
        color: var(--text2);
        font-weight: 600;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .season .pin em {
        font-style: normal;
        font-size: 11px;
        color: var(--faint);
      }
      .tag {
        font-size: 11px;
        padding: 0 6px;
        border-radius: 4px;
        border: 1px solid var(--brand);
        color: var(--brand);
        font-weight: 600;
        margin-left: 6px;
      }
      .data-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin: 12px 0;
      }
      .data-grid div {
        padding: 9px 12px;
        border-right: 1px solid var(--border);
      }
      .data-grid div:last-child {
        border-right: 0;
      }
      .data-grid b {
        display: block;
        font-size: 17px;
      }
      .data-grid span {
        font-size: 12px;
        color: var(--muted);
      }
      code {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 11.5px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        word-break: break-all;
      }
      .issue {
        border-left: 3px solid var(--c);
      }
      .banner {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--warn);
        border-radius: var(--r);
        background: var(--panel);
        margin-bottom: 16px;
      }
      .banner b {
        font-weight: 600;
      }
      .flags {
        border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--border));
        background: color-mix(in srgb, var(--bad) 6%, var(--panel));
        border-radius: 6px;
        padding: 10px 12px;
      }
      .flags b {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--bad);
        font-weight: 600;
        margin-bottom: 3px;
      }
      .flags span {
        font-size: 12.5px;
        color: var(--text2);
      }
      .steps {
        display: flex;
        gap: 4px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--panel2);
        overflow-x: auto;
      }
      .steps div {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--faint);
        font-weight: 550;
        padding-right: 10px;
        white-space: nowrap;
      }
      .steps i {
        width: 20px;
        height: 20px;
        border-radius: 50%;

        font-weight: 550;

      .mile .s {

      .rung .band {

      .ladder-open {

        align-items: center;

        font-variant-numeric: tabular-nums;

      .rank-facts span {
        color: var(--muted);

      .rank-facts b {

    <script>
      // ------------------------------------------------------------------ utils

      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,

      const P = {
        grid: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
        list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
        cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
        flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
        apple:
          '<path d="M12 7c-1.6-1.4-6.3-1.8-7.4 2.4C3.5 13.6 6 20 9 20c1.2 0 2-.6 3-.6s1.8.6 3 .6c3 0 5.5-6.4 4.4-10.6C18.3 5.2 13.6 5.6 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/>',
        heart:
          '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
        pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

        down: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
        trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',

        moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

        target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
        fire: '<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-4 5-4 7-1-1-2-2-2-4-2 2-3 5-3 9 0 4 3 7 7 7z"/>',
        info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
        edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
        folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
        more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
        phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
        wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/>',
        leaf: '<path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 16-10-1 12-5 16-9 17z"/><path d="M4 21c3-6 7-9 11-11"/>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
        gauge:
          '<path d="M12 14l4-4"/><circle cx="12" cy="14" r="1.6"/><path d="M4.2 17a9 9 0 1 1 15.6 0"/><path d="M4.2 17h15.6"/>',
        medal:
          '<circle cx="12" cy="15" r="6"/><path d="M12 12.5 13 15h2.2l-1.8 1.4.7 2.3-2.1-1.4-2.1 1.4.7-2.3L8.8 15H11z"/><path d="M8 3h8l-2.5 5.2M8 3l2.8 5.4"/>',
        // sport icons below are from Tabler Icons (MIT, https://tabler.io/icons)
        bike: '<path d="M2 18a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M16 18a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M12 19v-4l-3 -3l5 -4l2 3h3"/><path d="M13.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>',
        run: '<path d="M11.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M4 17l5 1l.75 -1.5"/><path d="M15 21v-4l-4 -3l1 -6"/><path d="M7 12v-3l5 -1l3 3l3 1"/>',
        swim: '<path d="M15 9a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M6 11l4 -2l3.5 3l-1.5 2"/><path d="M3 16.75a2.4 2.4 0 0 0 1 .25a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 1 -.25"/>',
        walk: '<path d="M12 4a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M7 21l3 -4"/><path d="M16 21l-2 -4l-3 -3l1 -6"/><path d="M6 12l2 -3l4 -1l3 3l3 1"/>',
        ski: '<path d="M17 17.5l-5 -4.5v-6l5 4"/><path d="M7 17.5l5 -4.5"/><path d="M15.103 21.58l6.762 -14.502a2 2 0 0 0 -.968 -2.657"/><path d="M8.897 21.58l-6.762 -14.503a2 2 0 0 1 .968 -2.657"/><path d="M7 11l5 -4"/><path d="M10.007 4a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>',
        row: '<path d="M6.414 6.414a2 2 0 0 0 0 -2.828l-1.414 -1.414l-2.828 2.828l1.414 1.414a2 2 0 0 0 2.828 0"/><path d="M17.586 17.586a2 2 0 0 0 0 2.828l1.414 1.414l2.828 -2.828l-1.414 -1.414a2 2 0 0 0 -2.828 0"/><path d="M6.5 6.5l11 11"/><path d="M22 2.5c-9.983 2.601 -17.627 7.952 -20 19.5c9.983 -2.601 17.627 -7.952 20 -19.5"/><path d="M6.5 12.5l5 5"/><path d="M12.5 6.5l5 5"/>',
        play: '<path d="M7 4v16l13-8z"/>',
        pause: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
      };
      const I = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24">${P[n]}</svg>`;
      const SC = {
        Swim: "#00a3ff",
        Bike: "#12b76a",
        Run: "#ff6b1a",
        Brick: "#00b8a9",
        Triathlon: "#8a5cf6",
        Duathlon: "#d9a521",
        Aquabike: "#0fb5ae",
        Multisport: "#8a5cf6",
        Row: "#f0387c",
        Ski: "#3b6bff",
        Hike: "#c98a0c",
        Walk: "#7cc521",
        Paddle: "#0fb5ae",
        Strength: "#8a5cf6",
        Mobility: "#a0a8b8",
        Other: "#9b6bff",
        Race: "#0a6cff",
        Rest: "#a0a8b8",
        T: "#a0a8b8",
      };
      const col = (s) => SC[s] || SC.Other;
      const PRIO = { A: "#f03d3d", B: "#ff9f0a", C: "#7a8699" };
      const PHASE = {
        Base: "#00a3ff",
        Build: "#5b5bff",
        Peak: "#ff6b1a",
        Recovery: "#12b76a",
        Taper: "#b35cff",
        "Race week": "#f03d3d",
      };
      const ZC = ["#a0a8b8", "#00a3ff", "#12b76a", "#f5b400", "#ff6b1a", "#f03d3d"];
      const SPORT_ICON = {
        Bike: "bike",
        Brick: "bike",
        Run: "run",
        Swim: "swim",
        Row: "row",
        Ski: "ski",
        Walk: "walk",
      };
      const sportIcon = (s) => `<span class="sporti" style="--c:${col(s)}">${I(SPORT_ICON[s] || "pulse")}</span>`;
      const badge = (s) => `<span class="badge" style="--c:${col(s)}"><i></i>${esc(s)}</span>`;
      const prio = (p) => `<span class="prio" style="--c:${PRIO[p]}" title="${p} race">${p}</span>`;
      const greeting = () => {
        const h = new Date().getHours(),
          n = (BOOT.name || "").split(/\s+/)[0];
        return `Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}${n ? ", " + n : ""}`;
      };
      const shortDate = (iso) =>
        new Date(iso + "T00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
      const store = {
        get(k, d) {
          try {
            const v = localStorage.getItem("ec." + k);
            return v == null ? d : JSON.parse(v);
          } catch {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem("ec." + k, JSON.stringify(v));
          } catch {}
        },
      };
      let API,
        BOOT,
        PAGE,
        CHARTS = [];

      async function call(name, ...args) {
        try {
          return await API[name](...args);
        } catch (e) {
          toast("Something went wrong", String((e && e.message) || e), "bad");
          throw e;
        }
      }
      let LAST_UNDO = null;
      function toast(title, msg = "", kind = "ok", action = null) {
        const c = { ok: "var(--ok)", bad: "var(--bad)", warn: "var(--warn)", info: "var(--brand)" }[kind];
        const el = document.createElement("div");
        el.className = "toast";
        el.style.setProperty("--c", c);
        el.setAttribute("role", kind === "bad" ? "alert" : "status");
        el.innerHTML = `<div class="ic">${I(kind === "ok" ? "check" : kind === "bad" ? "x" : "info")}</div><div><b>${esc(title)}</b>${msg ? `<span>${esc(msg)}</span>` : ""}</div><button class="icon-btn" title="Dismiss">${I("x")}</button>${action ? `<button class="btn sm act">${esc(action.label)}</button>` : ""}`;
        const box = $("#toasts"),
          close = () => el.remove();
        $("button", el).onclick = close;
        if (action)
          $(".act", el).onclick = () => {
            close();
            action.run();
          };
        box.append(el);
        while (box.children.length > 3) box.firstElementChild.remove();
        let t = setTimeout(close, Math.max(kind === "bad" ? 7000 : action ? 9000 : 3500, msg.length * 45));
        el.onmouseenter = () => clearTimeout(t);
        el.onmouseleave = () => {
          t = setTimeout(close, 2500);
        };
        return el;
      }
      function modal(html, { width, locked } = {}) {
        const root = $("#modalRoot");
        root.innerHTML = `<div class="overlay" ${locked ? "data-locked" : ""}><div class="modal" style="${width ? `width:min(${width}px,94vw)` : ""}">${html}</div></div>`;
        const ov = $(".overlay", root);
        ov.addEventListener("mousedown", (e) => {
          if (e.target === ov && !locked) closeModal();
        });
        $$("[data-close]", root).forEach((b) => (b.onclick = closeModal));
        return $(".modal", root);
      }
      function closeModal() {
        $("#modalRoot").innerHTML = "";
      }
      async function deleted(res, what, after) {
        // every delete is undoable instead of asking "are you sure?"
        if (!res || !res.ok) return toast("Could not delete", (res && res.error) || "", "bad");
        let el;
        const run = async () => {
          el.remove();
          if (LAST_UNDO === run) LAST_UNDO = null;
          const r = await call("undo", res.undo);
          r.ok ? toast("Restored", what) : toast("Could not undo", r.error, "bad");
          refreshAll();
        };
        LAST_UNDO = run;
        el = toast(`Deleted ${what}`, MOBILE ? "" : "Ctrl+Z also undoes this.", "ok", { label: "Undo", run });
        if (after) after();
        refreshAll();
      }
      function confirmBox(title, msg, okText = "Delete", danger = true) {
        return new Promise((res) => {
          const m = modal(
            `<div class="modal-h"><h3>${esc(title)}</h3></div><div class="modal-b">${esc(msg)}</div>
      <div class="modal-f"><span class="grow"></span><button class="btn" id="cNo">Cancel</button><button class="btn ${danger ? "danger-solid" : "primary"}" id="cYes">${esc(okText)}</button></div>`,
            { width: 440 },
          );
          $("#cNo").onclick = () => {
            closeModal();
            res(false);
          };
          $("#cYes").onclick = () => {
            closeModal();
            res(true);
          };
          $("#cYes").focus();
        });
      }

      // ------------------------------------------------------------------ charts (hand-rolled SVG, no deps)
      function niceScale(lo, hi, t = 5) {
        const span = hi - lo || 1,
          raw = span / t,
          mag = 10 ** Math.floor(Math.log10(raw)),
          n = raw / mag;
        const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
        return [Math.floor(lo / step) * step, Math.ceil(hi / step) * step, step];
      }
      function hoverTip(el, svg, m, pw, n, X, render) {
        const tip = $(".tip", el),
          hx = $(".hx", svg),
          dots = $(".dots", svg);
        const show = (e) => {
          const r = svg.getBoundingClientRect(),
            x = e.clientX - r.left;
          const i = Math.max(0, Math.min(n - 1, Math.round(((x - m.l) / pw) * (n - 1))));
          const { html, pts } = render(i);
          hx.setAttribute("x1", X(i));
          hx.setAttribute("x2", X(i));
          hx.style.visibility = "visible";
          dots.innerHTML = (pts || [])
            .map(
              (p) => `<circle cx="${X(i)}" cy="${p.y}" r="4" style="fill:${p.c};stroke:var(--panel);stroke-width:2"/>`,
            )
            .join("");
          tip.innerHTML = html;
          tip.style.opacity = 1;
          const tw = tip.offsetWidth,
            left = X(i) + 14 + tw > r.width ? X(i) - tw - 14 : X(i) + 14;
          tip.style.left = left + "px";
          tip.style.top = m.t + 6 + "px";
        };
        const hit = $(".hit", svg);
        hit.style.touchAction = "pan-y";
        hit.addEventListener("pointermove", show);
        hit.addEventListener("pointerdown", show);
        hit.addEventListener("pointerleave", (e) => {
          if (e.pointerType === "mouse") {
            tip.style.opacity = 0;
            hx.style.visibility = "hidden";
            dots.innerHTML = "";
          }
        });
      }
      function lineChart(
        el,
        {
          labels,
          series,
          height = 280,
          yfmt = (v, dec) => String(+v.toFixed(dec)),
          xfmt = shortDate,
          zero = false,
          marker = null,
          marks = [],
          split = 1e9,
          tipfmt = (v) => v,
        },
      ) {
        const W = el.clientWidth || 600,
          H = height,
          m = { l: 40, r: 12, t: marks.length ? 22 : 10, b: 26 },
          pw = W - m.l - m.r,
          ph = H - m.t - m.b,
          n = labels.length;
        let vals = series.flatMap((s) => s.data.filter((v) => v != null));
        if (!vals.length) vals = [0, 1];
        let lo = Math.min(...vals),
          hi = Math.max(...vals);
        if (zero) {
          lo = Math.min(lo, 0);
          hi = Math.max(hi, 0);
        }
        const pad = (hi - lo) * 0.08 || 1;
        const [a, b, step] = niceScale(zero && lo === 0 ? 0 : lo - pad, hi + pad, 4);
        const X = (i) => m.l + (n <= 1 ? pw / 2 : (pw * i) / (n - 1)),
          Y = (v) => m.t + ph - (ph * (v - a)) / (b - a || 1);
        let s = `<svg class="chart" width="${W}" height="${H}"><defs>${series.map((se, k) => `<linearGradient id="g${k}${el.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${se.color};stop-opacity:.22"/><stop offset="1" style="stop-color:${se.color};stop-opacity:0"/></linearGradient>`).join("")}</defs>`;
        for (let v = a; v <= b + step / 2; v += step)
          s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${yfmt(v, step < 1 ? 1 : 0)}</text>`;
        if (zero && a < 0) s += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
        const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / 78))));
        for (let i = 0; i < n; i += every)
          s += `<text x="${X(i)}" y="${H - 7}" text-anchor="middle">${esc(xfmt(labels[i]))}</text>`;
        if (marker != null && marker < n)
          s += `<line class="today" x1="${X(marker)}" x2="${X(marker)}" y1="${m.t}" y2="${m.t + ph}"/><text x="${X(marker) + 5}" y="${m.t + 11}">Today</text>`;
        let labelEnd = -1e9;
        marks.forEach((k) => {
          const x = X(k.i),
            name = k.name.length > 22 ? k.name.slice(0, 21) + "…" : k.name,
            w = name.length * 6.4;
          const end = x > W - w / 2 - 4,
            x0 = end ? x - w : x - w / 2;
          s += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t + ph}" style="stroke:${k.color};stroke-width:1.5;stroke-dasharray:3 3;opacity:.8"/>`;
          if (x0 < labelEnd + 8) return; // would overlap the previous label: the line and the tooltip still name it
          labelEnd = x0 + w;
          s += `<text x="${x}" y="${m.t - 8}" text-anchor="${end ? "end" : "middle"}" style="fill:${k.color};font-weight:600">${esc(name)}</text>`;
        });
        series.forEach((se, k) => {
          let d = "",
            pen = false,
            first = null,
            last = null;
          se.data.forEach((v, i) => {
            if (v == null) {
              pen = false;
              return;
            }
            d += (pen ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1);
            pen = true;
            if (first == null) first = i;
            last = i;
          });
          if (!d) return;
          if (se.area)
            s += `<path d="${d}L${X(last)},${Y(Math.max(a, 0))}L${X(first)},${Y(Math.max(a, 0))}Z" fill="url(#g${k}${el.id})"/>`;
          s += `<path class="line" d="${d}" style="stroke:${se.color};${se.dash ? "stroke-dasharray:5 4;opacity:.8" : ""}${se.thin ? ";stroke-width:1.6" : ""}"/>`;
        });
        s += `<line class="hx" y1="${m.t}" y2="${m.t + ph}"/><g class="dots"></g><rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip"></div>`;
        el.classList.add("chart-wrap");
        el.innerHTML = s;
        hoverTip(el, $("svg", el), m, pw, n, X, (i) => {
          const seen = new Set(),
            rows = [],
            pts = [];
          series.forEach((se) => {
            const v = se.data[i];
            if (v == null || seen.has(se.name)) return;
            seen.add(se.name);
            rows.push(
              `<div><span><i class="dot" style="--c:${se.color}"></i>${esc(se.name)}</span><b>${esc(tipfmt(v, se))}</b></div>`,
            );
            pts.push({ y: Y(v), c: se.color });
          });
          const mk = marks.find((k) => k.i === i);
          return {
            html: `<b>${esc(xfmt(labels[i]))}${i >= split ? " · plan" : ""}</b>${mk ? `<div style="color:${mk.color};font-weight:600">${esc(mk.name)}</div>` : ""}${rows.join("") || '<span class="muted">No data</span>'}`,
            pts,
          };
        });
      }
      function barChart(el, { labels, series, height = 240, yfmt = (v) => v, tipfmt = (v) => v }) {
        const W = el.clientWidth || 600,
          H = height,
          m = { l: 40, r: 12, t: 10, b: 26 },
          pw = W - m.l - m.r,
          ph = H - m.t - m.b,
          n = labels.length;
        const tot = labels.map((_, i) => series.reduce((a, s) => a + (s.data[i] || 0), 0));
        const [, b, step] = niceScale(0, Math.max(...tot, 1) * 1.05, 4);
        const bw = pw / n,
          w = Math.min(bw * 0.58, 34),
          X = (i) => m.l + bw * i + bw / 2,
          Y = (v) => m.t + ph - (ph * v) / b;
        let s = `<svg class="chart" width="${W}" height="${H}">`;
        for (let v = 0; v <= b + step / 2; v += step)
          s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${yfmt(v)}</text>`;
        const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / 60))));
        labels.forEach((lab, i) => {
          let acc = 0;
          const segs = series.filter((se) => se.data[i]);
          segs.forEach((se, k) => {
            const v = se.data[i],
              y0 = Y(acc),
              y1 = Y(acc + v),
              top = k === segs.length - 1;
            s += `<path d="M${X(i) - w / 2},${y0}V${y1 + (top ? 4 : 0)}${top ? `q0,-4 4,-4h${w - 8}q4,0 4,4` : `h${w}`}V${y0}Z" style="fill:${se.color}"/>`;
            acc += v;
          });
          if (i % every === 0) s += `<text x="${X(i)}" y="${H - 7}" text-anchor="middle">${esc(lab)}</text>`;
        });
        s += `<line class="hx" y1="${m.t}" y2="${m.t + ph}" style="opacity:0"/><g class="dots"></g><rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip"></div>`;
        el.classList.add("chart-wrap");
        el.innerHTML = s;
        hoverTip(el, $("svg", el), { ...m, l: m.l + bw / 2 }, pw - bw, n, X, (i) => ({
          html:
            `<b>${esc(labels[i])}</b>` +
            series
              .filter((se) => se.data[i])
              .map(
                (se) =>
                  `<div><span><i class="dot" style="--c:${se.color}"></i>${esc(se.name)}</span><b>${esc(tipfmt(se.data[i] || 0))}</b></div>`,
              )
              .join("") +
            `<div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span>Total</span><b>${esc(tipfmt(tot[i]))}</b></div>`,
          pts: [],
        }));
      }
      function donut(parts, { size = 168, stroke = 20, center = "", sub = "" } = {}) {
        const r = (size - stroke) / 2,
          c = 2 * Math.PI * r,
          tot = parts.reduce((a, p) => a + p.value, 0);
        let off = 0,
          segs = "";
        if (tot > 0)
          parts.forEach((p) => {
            const len = (c * p.value) / tot;
            if (len > 0)
              segs += `<circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" style="stroke:${p.color}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0, len - 2)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
            off += len;
          });
        return `<svg width="${size}" height="${size}" style="flex:none"><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" style="stroke:var(--grid)" stroke-width="${stroke}"/>${segs}
    <text x="50%" y="${size / 2 - 1}" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--text)">${esc(center)}</text>
    <text x="50%" y="${size / 2 + 17}" text-anchor="middle" style="font-size:11.5px;fill:var(--muted)">${esc(sub)}</text></svg>`;
      }
      function ring(score, size = 116) {
        const r = (size - 14) / 2,
          c = 2 * Math.PI * r,
          v = score ?? 0,
          cl = score == null ? "var(--faint)" : v >= 80 ? "var(--ok)" : v >= 60 ? "var(--warn)" : "var(--bad)";
        return `<svg width="${size}" height="${size}" style="flex:none"><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" style="stroke:var(--grid)" stroke-width="12"/>
    ${score == null ? "" : `<circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" style="stroke:${cl}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * v) / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`}
    <text x="50%" y="${size / 2 + 2}" text-anchor="middle" style="font-size:26px;font-weight:750;fill:var(--text)">${score ?? "–"}</text>
    <text x="50%" y="${size / 2 + 19}" text-anchor="middle" style="font-size:11px;fill:var(--muted)">readiness</text></svg>`;
      }
      function spark(data, color) {
        if (!data || data.length < 2) return "";
        const lo = Math.min(...data),
          hi = Math.max(...data),
          W = 96,
          H = 34,
          X = (i) => (i * W) / (data.length - 1),
          Y = (v) => H - 3 - ((H - 6) * (v - lo)) / (hi - lo || 1);
        const d = data.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join("");
        return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}L${W},${H}L0,${H}Z" style="fill:${color};opacity:.12"/><path d="${d}" style="fill:none;stroke:${color};stroke-width:1.8"/></svg>`;
      }

      // ------------------------------------------------------------------ shell
      const NAV = [

      function openMore() {

        return QUEUE;
      }
      async function refreshAll() {

        ) {
          e.preventDefault();
          return LAST_UNDO();
        }
        const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (typing || e.ctrlKey || e.metaKey || e.altKey || $("#modalRoot").innerHTML) return;
        if (e.key === "n" || e.key === "N") {

      const DARK = matchMedia("(prefers-color-scheme: dark)");

      const verdictChip = (a) =>
        `<span class="vchip" style="--c:${VC[a.level]}">${I(VICON[a.level])}${esc(a.label)}</span>`;

  ${
